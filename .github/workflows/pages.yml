name: Deploy Vibe POC to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Build with the repository's Pages base path
        env:
          REPO_NAME: ${{ github.event.repository.name }}
          OWNER_NAME: ${{ github.repository_owner }}
        run: |
          if [ "${REPO_NAME,,}" = "${OWNER_NAME,,}.github.io" ]; then
            base_href="/"
          else
            base_href="/$REPO_NAME/"
          fi
          npm run build -- --base-href "$base_href"
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: dist/vibe-poc/browser
      - id: deployment
        uses: actions/deploy-pages@v4
